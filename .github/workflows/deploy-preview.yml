name: Deploy Preview to Vercel

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy preview to Vercel
        # No --prod: deploys to Preview, picking up the dev-branch-scoped env
        # vars (DATABASE_URL, APP_URL, AUTH_SECRET, SEED_OWNER_EMAIL). Vercel
        # CLI reads the git branch/commit from the local checkout automatically.
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
