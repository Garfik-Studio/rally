name: Require dev as PR source

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR is from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs into main must be raised from the dev branch (got '${{ github.head_ref }}')."
            exit 1
          fi
