# `gcloud builds submit --tag` (no build-args support) can't get
# NEXT_PUBLIC_SENTRY_DSN into the image — see Dockerfile. This config
# swaps in a plain `docker build --build-arg` step instead.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN}
      - -t
      - ${_TAG}
      - .
images:
  - ${_TAG}
options:
  # Default GCS log bucket only streams to project Viewer/Owner (legacy
  # primitive roles) — rally-deployer has granular roles instead, so
  # `gcloud builds submit` 500s waiting to stream. Cloud Logging respects
  # normal IAM (roles/logging.viewer, granted in docs/06-gcp-migration.md).
  logging: CLOUD_LOGGING_ONLY
